# =============================================================================
# BLE mouse jiggler, standalone edition: no Home Assistant, no router config.
#
# First boot: the jiggler starts its own Wi-Fi network. Join it from your phone, pick your
# home Wi-Fi from the list, and you're done. After that, open the jiggler's page from any
# device on the same network to pair, switch it on and change settings.
#
# Everything you set on the page is stored on the device. See README-standalone.md.
# =============================================================================

substitutions:
  # The setup network and the page address are built from this plus 6 characters of the
  # device's MAC address, e.g. "mouse-jiggler-a1b2c3" / http://mouse-jiggler-a1b2c3.local
  devicename: mouse-jiggler
  friendly_name: "Mouse Jiggler"

  # What the page starts with before you change anything.
  default_profile: "0"           # 0 = Logitech MX Anywhere 3 (see the list on the page)
  default_min_interval: "120"    # seconds
  default_max_interval: "180"    # seconds
  default_amplitude: "2"         # pixels
  pairing_timeout: 120s
  # Password for the setup network. Empty = open, which is easiest on a phone. The setup network
  # only exists while no saved Wi-Fi works. If you set one it must be 8 or more characters.
  setup_password: ""
  firmware_version: "1.0.0"

  # --- Board pins (UNVERIFIED for your board: check the I2C scan in the log) ---
  pin_sda: GPIO5
  pin_scl: GPIO6
  pin_led: GPIO8
  led_inverted: "true"
  pin_button: GPIO9
  i2c_address: "0x3C"

  # --- Display (72x40 window inside a 128x64 SSD1306 RAM) ---
  oled_model: "SSD1306 72x40"
  oled_offset_x: "0"
  oled_offset_y: "0"
  oled_flip_x: "true"
  oled_flip_y: "true"
  oled_test_pattern: "false"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: "2026.9.0"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Settings are written by the portal component itself, immediately; nothing else needs flash.
preferences:
  flash_write_interval: 5min

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    esp32_ble: WARN

# -----------------------------------------------------------------------------
# Network. No networks are listed here on purpose: the page stores them on the device.
#   * Nothing saved      -> the setup network "<devicename>-xxxxxx" is offered right away.
#   * Saved but unreachable for 45 s -> the setup network comes back (and goes away again
#     by itself as soon as a saved network connects).
#   * With several saved networks it joins the strongest one, and between access points of
#     the same network it moves to a clearly better one on its own (post_connect_roaming).
# -----------------------------------------------------------------------------
wifi:
  ap:                       # open setup network named after the device
    password: ${setup_password}
    ap_timeout: 45s
  power_save_mode: light    # keeps Wi-Fi fair to Bluetooth on the single radio
  fast_connect: false       # always scan, so the best saved network / access point wins
  post_connect_roaming: true
  reboot_timeout: 0s        # never reboot just because the router is away

captive_portal:             # DNS redirect + scanning while the setup network is up

mdns:

web_server_base:

# Firmware updates from the browser (Device > Update firmware on the page).
ota:
  - platform: web_server
    on_begin:
      - lambda: |-
          id(portal)->set_ota_state(true, 0);
          id(portal)->touch();
    on_progress:
      - lambda: |-
          id(portal)->set_ota_state(true, x);
    on_end:
      - lambda: |-
          id(portal)->set_ota_state(false, 100);
    on_error:
      - lambda: |-
          id(portal)->set_ota_state(false, 0);

# -----------------------------------------------------------------------------
# Bluetooth: ESPHome's own BLE stack (Bluedroid) hosts the custom HID component.
# -----------------------------------------------------------------------------
esp32_ble:
  name: "BT Mouse"          # replaced at boot by the identity chosen on the page
  io_capability: none       # "Just Works" pairing, like a real mouse

external_components:
  # Fetched by ESPHome from GitHub, so you only need this one file.
  - source: github://witoldwitkowski/esphome-ble-jiggler@main
    components: [ble_hid_mouse, jiggler_portal]
  # For local development instead (components/ next to this file), use:
  #   - source:
  #       type: local
  #       path: components
  #     components: [ble_hid_mouse, jiggler_portal]

ble_hid_mouse:
  id: mouse
  pairing_timeout: ${pairing_timeout}

jiggler_portal:
  id: portal
  mouse_id: mouse
  default_profile: ${default_profile}
  default_min_interval: ${default_min_interval}
  default_max_interval: ${default_max_interval}
  default_amplitude: ${default_amplitude}
  firmware_version: ${firmware_version}
  weak_signal_recovery: true

# -----------------------------------------------------------------------------
# Physical controls and LED
#   tap          : show the network address on the OLED
#   hold 3 s     : pairing mode
#   hold 10 s    : forget the paired computer + pairing mode
#   hold 20 s    : forget all Wi-Fi networks and restart into setup mode
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: boot_button
    pin:
      number: ${pin_button}
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true   # only read after boot
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1500ms
        then:
          - lambda: 'id(portal)->on_button_short();'
      - min_length: 3s
        max_length: 9s
        then:
          - lambda: 'id(portal)->on_button_pair();'
      - min_length: 10s
        max_length: 19s
        then:
          - lambda: 'id(portal)->on_button_forget();'
      - min_length: 20s
        max_length: 120s
        then:
          - lambda: 'id(portal)->on_button_wifi_reset();'

output:
  - platform: gpio
    id: led_out
    pin:
      number: ${pin_led}
      inverted: ${led_inverted}
      ignore_strapping_warning: true   # GPIO8 is a strapping pin; fine as a post-boot LED

interval:
  # LED: slow blink while the setup network is up, dark otherwise.
  - interval: 500ms
    then:
      - lambda: |-
          if (id(portal)->setup_ap_active()) {
            static bool on = false;
            on = !on;
            if (on) id(led_out).turn_on(); else id(led_out).turn_off();
          } else {
            id(led_out).turn_off();
          }
  # Display power: blank when switched off on the page, dim after the idle time.
  - interval: 250ms
    then:
      - lambda: |-
          static bool is_off = false, is_dim = false;
          const bool want_on = id(portal)->display_wanted();
          if (!want_on && !is_off) {
            id(oled)->turn_off();
            is_off = true;
          } else if (want_on && is_off) {
            id(oled)->turn_on();
            is_off = false;
            is_dim = false;
            id(oled)->set_contrast(1.0f);
          }
          if (want_on) {
            const bool dim = id(portal)->dim_wanted();
            if (dim && !is_dim) { id(oled)->set_contrast(0.0f); is_dim = true; }
            else if (!dim && is_dim) { id(oled)->set_contrast(1.0f); is_dim = false; }
          }

# -----------------------------------------------------------------------------
# OLED
# -----------------------------------------------------------------------------
i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  frequency: 400kHz
  scan: true

display:
  - platform: ssd1306_i2c
    id: oled
    model: ${oled_model}
    address: ${i2c_address}
    offset_x: ${oled_offset_x}
    offset_y: ${oled_offset_y}
    flip_x: ${oled_flip_x}
    flip_y: ${oled_flip_y}
    update_interval: 200ms
    lambda: |-
      if (!id(portal)->display_wanted()) return;
      jiggler_ui::UiState s{};
      s.standalone = true;
      const bool ready = id(mouse)->is_ready();
      if (id(mouse)->pairing_active())  s.bt = jiggler_ui::BtState::PAIRING;
      else if (ready)                   s.bt = jiggler_ui::BtState::CONNECTED;
      else if (id(mouse)->has_bond())   s.bt = jiggler_ui::BtState::BONDED_IDLE;
      else                              s.bt = jiggler_ui::BtState::NO_BOND;
      s.enabled = id(mouse)->is_enabled();
      s.pulse = id(mouse)->ms_since_jiggle() < 1000;
      s.wifi_bars = id(portal)->wifi_bars();
      s.progress = (s.enabled && ready) ? id(mouse)->interval_progress() : -1.0f;
      s.ota = id(portal)->ota_active();
      s.ota_pct = id(portal)->ota_pct();
      s.now_ms = millis();
      s.test_pattern = ${oled_test_pattern};
      s.setup_ap = id(portal)->setup_ap_active();
      s.show_info = id(portal)->info_screen_active() && id(portal)->wifi_connected();
      s.tag = id(portal)->tag();
      s.ip = id(portal)->ip_text();
      jiggler_ui::draw(it, s);
