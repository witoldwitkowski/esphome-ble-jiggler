# Paste into a dashboard: Edit dashboard -> Add card -> Manual.
type: vertical-stack
cards:
  - type: entities
    title: BLE Jiggler
    show_header_toggle: false
    entities:
      - entity: switch.ble_jiggler_jiggler_enabled
      - entity: binary_sensor.ble_jiggler_bluetooth_connected
      - entity: binary_sensor.ble_jiggler_bluetooth_link
      - entity: sensor.ble_jiggler_next_jiggle_in
      - entity: sensor.ble_jiggler_last_jiggle
      - entity: sensor.ble_jiggler_jiggles_since_boot
      - entity: sensor.ble_jiggler_time_since_ble_disconnect
      - type: divider
      - entity: button.ble_jiggler_jiggle_now
      - entity: button.ble_jiggler_start_pairing_mode
      - entity: binary_sensor.ble_jiggler_pairing_mode_active
      - entity: binary_sensor.ble_jiggler_paired_host_present
      - type: divider
      - entity: number.ble_jiggler_min_interval
      - entity: number.ble_jiggler_max_interval
      - entity: number.ble_jiggler_amplitude
      - entity: switch.ble_jiggler_display_on
      - entity: number.ble_jiggler_display_timeout
      - entity: button.ble_jiggler_forget_paired_host
      - entity: switch.ble_jiggler_nightly_reboot
      - entity: sensor.ble_jiggler_free_heap
      - entity: button.ble_jiggler_restart

  - type: entities
    title: Sleep and unlock Mac
    show_header_toggle: false
    entities:
      - entity: button.ble_jiggler_put_mac_to_sleep
      - entity: select.ble_jiggler_sleep_key
      - entity: switch.ble_jiggler_lock_before_sleep
      - entity: number.ble_jiggler_sleep_lock_to_sleep_gap_ms
      - entity: switch.ble_jiggler_turn_jiggler_off_after_sleep
      - type: divider
      - entity: button.ble_jiggler_wake_and_unlock_mac
      - entity: button.ble_jiggler_cancel_key_sequence
      - entity: sensor.ble_jiggler_key_status
      - entity: binary_sensor.ble_jiggler_key_sequence_running
      - type: divider
      - entity: switch.ble_jiggler_unlock_dry_run
      - entity: switch.ble_jiggler_press_return_after_password
      - entity: switch.ble_jiggler_re_enable_jiggler_after_unlock
      - entity: text.ble_jiggler_mac_password
      - entity: number.ble_jiggler_unlock_wake_wait_ms
      - entity: number.ble_jiggler_unlock_space_to_return_gap_ms
      - entity: number.ble_jiggler_unlock_password_field_wait_ms
      - entity: number.ble_jiggler_unlock_wait_for_mac_to_reconnect_s
      - entity: number.ble_jiggler_unlock_cooldown_s
