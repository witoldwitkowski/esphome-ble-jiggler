# Put the paired Mac to sleep with the jiggler's sleep macro, then report the result.
# Paste into Settings -> Automations & Scenes -> Scripts -> Add script -> Edit in YAML.
# Entity IDs assume the device name "BLE Jiggler"; adjust if HA named them differently
# (Settings -> Devices & Services -> ESPHome -> BLE Jiggler).
#
# CALIBRATE FIRST (README, "Sleep macro"). Until the numbers are calibrated for your Mac, this
# script can click whatever is under the pointer.
alias: "Put Mac to sleep (jiggler macro)"
description: "Runs the BLE Jiggler sleep macro if Bluetooth is connected and no macro is running, then notifies."
mode: single
sequence:
  - if:
      - condition: state
        entity_id: binary_sensor.ble_jiggler_bluetooth_connected
        state: "on"
      - condition: state
        entity_id: binary_sensor.ble_jiggler_sleep_macro_running
        state: "off"
    then:
      - action: button.press
        target:
          entity_id: button.ble_jiggler_put_mac_to_sleep
      # Wait for the run to start, then to finish (about 10 s of mouse work plus the
      # confirmation timeout, 30 s by default).
      - wait_template: "{{ is_state('binary_sensor.ble_jiggler_sleep_macro_running', 'on') }}"
        timeout: "00:00:10"
        continue_on_timeout: true
      - wait_template: "{{ is_state('binary_sensor.ble_jiggler_sleep_macro_running', 'off') }}"
        timeout: "00:02:00"
        continue_on_timeout: true
      - action: notify.notify   # or notify.mobile_app_<your_phone>
        data:
          title: "Mac sleep macro"
          message: >-
            Result: {{ states('sensor.ble_jiggler_sleep_macro_status') }}
            {% if is_state('switch.ble_jiggler_sleep_macro_dry_run', 'on') %}(dry run is ON: nothing was clicked){% endif %}
    else:
      - action: notify.notify
        data:
          title: "Mac sleep macro"
          message: >-
            Not started: {{ 'a macro is already running' if is_state('binary_sensor.ble_jiggler_sleep_macro_running', 'on')
            else 'Bluetooth is not connected to the Mac' }}.
