# EXAMPLE ONLY: put the Mac to sleep at a fixed time. Change the time and days, and only enable
# this after the macro has worked reliably by hand several times (README, "Sleep macro").
# Needs ha/script_sleep_mac.yaml saved as script.put_mac_to_sleep_jiggler_macro (HA derives the
# script entity ID from its alias; adjust the entity below to match yours).
alias: "EXAMPLE: Mac to sleep at night"
description: "Example trigger for the jiggler's sleep macro. Disabled by default; review before enabling."
mode: single
triggers:
  - trigger: time
    at: "23:30:00"           # <- choose your time
conditions:
  - condition: time
    weekday: [mon, tue, wed, thu, fri]   # <- choose your days
  - condition: state
    entity_id: binary_sensor.ble_jiggler_bluetooth_connected
    state: "on"
  - condition: state
    entity_id: switch.ble_jiggler_sleep_macro_dry_run
    state: "off"             # stay quiet while you are still tuning in dry-run mode
actions:
  - action: script.turn_on
    target:
      entity_id: script.put_mac_to_sleep_jiggler_macro
