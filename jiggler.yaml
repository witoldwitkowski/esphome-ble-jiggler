# =============================================================================
# BLE mouse jiggler: ESP32-C3 + 0.42" OLED, controlled from Home Assistant.
# Pairs with a Mac (or any host) as a standard Bluetooth LE HID mouse.
# See README.md for install, pairing and troubleshooting.
# =============================================================================

# -----------------------------------------------------------------------------
# Everything you might want to change lives here.
# -----------------------------------------------------------------------------
substitutions:
  devicename: ble-jiggler
  friendly_name: "BLE Jiggler"

  # --- Bluetooth identity (what the host sees) -------------------------------
  # Name shown in macOS Bluetooth settings. Max 20 characters.
  ble_name: "MX Anywhere 3"
  ble_manufacturer: "Logitech"
  ble_model: "MX Anywhere 3"
  # PnP ID: source "usb" = USB-IF vendor id (0x046D is Logitech), or "bluetooth".
  ble_vid_source: usb
  ble_vid: "0x046D"
  ble_pid: "0xB025"
  ble_version: "0x0001"
  pairing_timeout: 120s

  # --- Jiggle defaults (used on first boot; HA changes persist afterwards) ---
  default_min_interval: "120"   # seconds, 10-3600
  default_max_interval: "180"   # seconds, 10-3600
  default_amplitude: "2"        # pixels, 1-5
  default_display_timeout: "60" # seconds before dimming, 0 = never
  nightly_reboot_hour: "4"      # local time (from HA), used when "Nightly reboot" is on
  nightly_reboot_minute: "0"

  # --- Board pins (UNVERIFIED for your board: run the I2C scan first) --------
  pin_sda: GPIO5
  pin_scl: GPIO6
  pin_led: GPIO8
  led_inverted: "true"
  pin_button: GPIO9
  i2c_address: "0x3C"

  # --- Display (72x40 window inside a 128x64 SSD1306 RAM) ---------------------
  oled_model: "SSD1306 72x40"
  oled_offset_x: "0"
  oled_offset_y: "0"
  oled_flip_x: "true"
  oled_flip_y: "true"
  # Set to "true" to draw a corner/border test pattern instead of the UI.
  oled_test_pattern: "false"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  min_version: "2026.9.0"
  # Late in boot: push the restored HA settings into the jiggle engine.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (!std::isnan(id(min_interval).state)) id(mouse)->set_min_interval_s(id(min_interval).state);
          if (!std::isnan(id(max_interval).state)) id(mouse)->set_max_interval_s(id(max_interval).state);
          if (!std::isnan(id(amplitude).state)) id(mouse)->set_amplitude((uint8_t) id(amplitude).state);
          id(mouse)->set_enabled(id(jiggler_enabled).state);
          id(mouse)->set_quiet(id(quiet_persist) && id(macro_quiet).state);  // stay silent across a reboot until re-enabled
          id(last_activity_ms) = millis();

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Flash writes for restore_value settings are rate-limited by ESPHome (default 1 min).
preferences:
  flash_write_interval: 5min

# Native USB Serial/JTAG on the C3 (flashing + logs only; it cannot be a USB HID device).
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    esp32_ble: WARN

# --- Network: no fallback AP, no captive portal; never reboot for lack of Wi-Fi/HA ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Modem sleep keeps the single radio fair to Bluetooth (see README troubleshooting).
  power_save_mode: light
  reboot_timeout: 0s

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - lambda: |-
          id(ota_active) = true;
          id(ota_percent) = 0;
          id(last_activity_ms) = millis();
    on_progress:
      - lambda: |-
          id(ota_percent) = x;
    on_end:
      - lambda: |-
          id(ota_active) = false;
    on_error:
      - lambda: |-
          id(ota_active) = false;

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Optional housekeeping reboot. Needs HA time sync; skipped while a jiggle is mid-flight.
      - seconds: 0
        minutes: ${nightly_reboot_minute}
        hours: ${nightly_reboot_hour}
        then:
          - if:
              condition:
                and:
                  - switch.is_on: nightly_reboot
                  - lambda: 'return !id(mouse)->jiggling() && !id(ota_active);'
              then:
                - logger.log: "Nightly reboot"
                - button.press: restart_button

# -----------------------------------------------------------------------------
# Bluetooth: ESPHome's own BLE stack (Bluedroid) hosts our custom HID component.
# -----------------------------------------------------------------------------
esp32_ble:
  name: ${ble_name}
  io_capability: none    # "Just Works" pairing, like a real mouse

external_components:
  # Fetched by ESPHome from GitHub, so you only need to paste this one file.
  - source: github://witoldwitkowski/esphome-ble-jiggler@main
    components: [ble_hid_mouse]
  # For local development instead (components/ next to this file), use:
  #   - source:
  #       type: local
  #       path: components
  #     components: [ble_hid_mouse]

ble_hid_mouse:
  id: mouse
  manufacturer: ${ble_manufacturer}
  model: ${ble_model}
  vendor_id_source: ${ble_vid_source}
  vendor_id: ${ble_vid}
  product_id: ${ble_pid}
  product_version: ${ble_version}
  pairing_timeout: ${pairing_timeout}
  connected:
    name: "Bluetooth connected"
    id: bt_connected
  link:
    name: "Bluetooth link"        # raw link up, even before the host subscribes
    entity_category: diagnostic
  bonded:
    name: "Paired host present"
    entity_category: diagnostic
  pairing:
    name: "Pairing mode active"
    entity_category: diagnostic
  on_jiggle:
    - lambda: |-
        id(last_activity_ms) = millis();
    - sensor.template.publish:
        id: jiggle_count_sensor
        state: !lambda "return id(mouse)->jiggle_count();"
    - sensor.template.publish:
        id: last_jiggle_sensor
        state: !lambda "return (float) id(ha_time).timestamp_now();"

# -----------------------------------------------------------------------------
# Persistent runtime state
# -----------------------------------------------------------------------------
globals:
  - id: ota_active
    type: bool
    initial_value: "false"
  - id: ota_percent
    type: float
    initial_value: "0"
  - id: last_activity_ms
    type: uint32_t
    initial_value: "0"
  - id: last_sig
    type: uint32_t
    initial_value: "0"
  - id: oled_dimmed
    type: bool
    initial_value: "false"
  - id: oled_off
    type: bool
    initial_value: "false"
  - id: preset_loading
    type: bool
    initial_value: "false"
  - id: macro_seq_seen
    type: uint32_t
    initial_value: "0"
  - id: quiet_persist
    type: bool
    restore_value: true
    initial_value: "false"

# -----------------------------------------------------------------------------
# Controls
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: "Jiggler enabled"
    id: jiggler_enabled
    icon: mdi:mouse-move-vertical
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(mouse)->set_enabled(true);
          id(last_activity_ms) = millis();
    turn_off_action:
      - lambda: |-
          id(mouse)->set_enabled(false);
          id(last_activity_ms) = millis();

  - platform: template
    name: "Display on"
    id: display_on
    icon: mdi:monitor
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(last_activity_ms) = millis();
    turn_off_action:
      - lambda: |-
          id(last_activity_ms) = millis();

  - platform: template
    name: "Nightly reboot"
    id: nightly_reboot
    icon: mdi:restart-alert
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "Status LED heartbeat"
    id: led_heartbeat
    icon: mdi:led-on
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "Sleep macro dry run"
    id: macro_dry_run
    icon: mdi:test-tube
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "Disable jiggler after sleep macro"
    id: macro_disable_jiggler
    icon: mdi:mouse-off
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  - platform: template
    name: "Quiet after sleep"
    id: macro_quiet
    icon: mdi:bluetooth-off
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_off_action:
      - lambda: |-
          id(mouse)->set_quiet(false);

number:
  - platform: template
    name: "Min interval"
    id: min_interval
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_min_interval}
    set_action:
      - lambda: |-
          id(mouse)->set_min_interval_s(x);

  - platform: template
    name: "Max interval"
    id: max_interval
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_max_interval}
    set_action:
      - lambda: |-
          id(mouse)->set_max_interval_s(x);

  - platform: template
    name: "Amplitude"
    id: amplitude
    icon: mdi:arrow-expand-all
    entity_category: config
    unit_of_measurement: px
    min_value: 1
    max_value: 5
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_amplitude}
    set_action:
      - lambda: |-
          id(mouse)->set_amplitude((uint8_t) x);

  - platform: template
    name: "Display timeout"
    id: display_timeout
    icon: mdi:monitor-off
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 3600
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_display_timeout}

  - platform: template
    name: "Slam report count"
    id: m_slam_count
    icon: mdi:arrow-collapse-up
    entity_category: config
    min_value: 5
    max_value: 300
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 40
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Slam counts per report"
    id: m_slam_cpr
    icon: mdi:speedometer
    entity_category: config
    unit_of_measurement: "counts"
    min_value: 1
    max_value: 127
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 127
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Slam interval (ms)"
    id: m_slam_interval_ms
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "ms"
    min_value: 5
    max_value: 200
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 15
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Slam settle time (ms)"
    id: m_settle_ms
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: "ms"
    min_value: 100
    max_value: 5000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 500
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Slam repeat passes"
    id: m_slam_passes
    icon: mdi:repeat
    entity_category: config
    min_value: 1
    max_value: 3
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Drift counts per step"
    id: m_drift_cps
    icon: mdi:speedometer-slow
    entity_category: config
    unit_of_measurement: "counts"
    min_value: 1
    max_value: 3
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 2
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Drift step interval (ms)"
    id: m_drift_interval_ms
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "ms"
    min_value: 5
    max_value: 200
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 20
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Drift scale (%)"
    id: m_drift_scale_pct
    icon: mdi:percent
    entity_category: config
    unit_of_measurement: "%"
    min_value: 25
    max_value: 400
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 100
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Apple logo X (counts)"
    id: m_logo_x
    icon: mdi:apple
    entity_category: config
    unit_of_measurement: "counts"
    min_value: 0
    max_value: 300
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 24
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Apple logo Y (counts)"
    id: m_logo_y
    icon: mdi:apple
    entity_category: config
    unit_of_measurement: "counts"
    min_value: 0
    max_value: 200
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 14
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Sleep row Y (counts)"
    id: m_sleep_y
    icon: mdi:sleep
    entity_category: config
    unit_of_measurement: "counts"
    min_value: 0
    max_value: 800
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 190
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Sleep row X adjust (counts)"
    id: m_sleep_x
    icon: mdi:sleep
    entity_category: config
    unit_of_measurement: "counts"
    min_value: -200
    max_value: 200
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Dwell before click (ms)"
    id: m_dwell_before_ms
    icon: mdi:cursor-default-click
    entity_category: config
    unit_of_measurement: "ms"
    min_value: 0
    max_value: 5000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 300
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Click hold (ms)"
    id: m_click_hold_ms
    icon: mdi:cursor-default-click
    entity_category: config
    unit_of_measurement: "ms"
    min_value: 20
    max_value: 1000
    step: 10
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 80
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Menu-open dwell (ms)"
    id: m_menu_dwell_ms
    icon: mdi:menu
    entity_category: config
    unit_of_measurement: "ms"
    min_value: 100
    max_value: 5000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 800
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Hover dwell (ms)"
    id: m_hover_dwell_ms
    icon: mdi:cursor-default
    entity_category: config
    unit_of_measurement: "ms"
    min_value: 0
    max_value: 3000
    step: 50
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 400
    set_action:
      - lambda: |-
          if (!id(preset_loading)) id(macro_target).make_call().set_option("Custom").perform();

  - platform: template
    name: "Sleep confirmation timeout (s)"
    id: m_confirm_timeout_s
    icon: mdi:timer-alert-outline
    entity_category: config
    unit_of_measurement: "s"
    min_value: 5
    max_value: 120
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 30

  - platform: template
    name: "Macro cooldown (s)"
    id: m_cooldown_s
    icon: mdi:timer-lock-outline
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0
    max_value: 600
    step: 5
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 60

select:
  - platform: template
    name: "Target macOS"
    id: macro_target
    icon: mdi:laptop
    entity_category: config
    options: ["macOS 26 Tahoe", "macOS 15 Sequoia", "macOS 14 Sonoma", "Custom"]
    initial_option: "macOS 26 Tahoe"
    optimistic: true
    restore_value: true
    # Choosing a preset loads its starting numbers. They are UNVERIFIED guesses, not measurements.
    set_action:
      - lambda: |-
          int idx = x == "macOS 26 Tahoe" ? 0 : x == "macOS 15 Sequoia" ? 1 : x == "macOS 14 Sonoma" ? 2 : -1;
          if (idx < 0) return;
          const auto &p = esphome::ble_hid_mouse::macro_preset(idx);
          ESP_LOGW("sleep_macro", "Loading preset '%s': UNVERIFIED starting values, not measured. Calibrate before trusting.", x.c_str());
          id(preset_loading) = true;
          id(m_slam_count).make_call().set_value(p.slam_count).perform();
          id(m_slam_cpr).make_call().set_value(p.slam_cpr).perform();
          id(m_slam_interval_ms).make_call().set_value(p.slam_interval_ms).perform();
          id(m_settle_ms).make_call().set_value(p.settle_ms).perform();
          id(m_slam_passes).make_call().set_value(p.slam_passes).perform();
          id(m_drift_cps).make_call().set_value(p.drift_cps).perform();
          id(m_drift_interval_ms).make_call().set_value(p.drift_interval_ms).perform();
          id(m_drift_scale_pct).make_call().set_value(p.drift_scale_pct).perform();
          id(m_logo_x).make_call().set_value(p.logo_x).perform();
          id(m_logo_y).make_call().set_value(p.logo_y).perform();
          id(m_sleep_y).make_call().set_value(p.sleep_y).perform();
          id(m_sleep_x).make_call().set_value(p.sleep_x).perform();
          id(m_dwell_before_ms).make_call().set_value(p.dwell_before_ms).perform();
          id(m_click_hold_ms).make_call().set_value(p.click_hold_ms).perform();
          id(m_menu_dwell_ms).make_call().set_value(p.menu_dwell_ms).perform();
          id(m_hover_dwell_ms).make_call().set_value(p.hover_dwell_ms).perform();
          id(preset_loading) = false;

  - platform: template
    name: "Menu corner"
    id: macro_corner
    icon: mdi:arrow-top-left
    entity_category: config
    # Top-left = the leftmost display's top-left. Top-right = the rightmost display's top-right
    # (X mirrored, for right-to-left system languages).
    options: ["Top-left", "Top-right"]
    initial_option: "Top-left"
    optimistic: true
    restore_value: true

script:
  - id: macro_run
    mode: single
    parameters:
      mode: int
    then:
      - lambda: |-
          auto &p = id(mouse)->macro_params();
          p.slam_count = (decltype(p.slam_count)) id(m_slam_count).state;
          p.slam_cpr = (decltype(p.slam_cpr)) id(m_slam_cpr).state;
          p.slam_interval_ms = (decltype(p.slam_interval_ms)) id(m_slam_interval_ms).state;
          p.settle_ms = (decltype(p.settle_ms)) id(m_settle_ms).state;
          p.slam_passes = (decltype(p.slam_passes)) id(m_slam_passes).state;
          p.drift_cps = (decltype(p.drift_cps)) id(m_drift_cps).state;
          p.drift_interval_ms = (decltype(p.drift_interval_ms)) id(m_drift_interval_ms).state;
          p.drift_scale_pct = (decltype(p.drift_scale_pct)) id(m_drift_scale_pct).state;
          p.logo_x = (decltype(p.logo_x)) id(m_logo_x).state;
          p.logo_y = (decltype(p.logo_y)) id(m_logo_y).state;
          p.sleep_y = (decltype(p.sleep_y)) id(m_sleep_y).state;
          p.sleep_x = (decltype(p.sleep_x)) id(m_sleep_x).state;
          p.dwell_before_ms = (decltype(p.dwell_before_ms)) id(m_dwell_before_ms).state;
          p.click_hold_ms = (decltype(p.click_hold_ms)) id(m_click_hold_ms).state;
          p.menu_dwell_ms = (decltype(p.menu_dwell_ms)) id(m_menu_dwell_ms).state;
          p.hover_dwell_ms = (decltype(p.hover_dwell_ms)) id(m_hover_dwell_ms).state;
          p.confirm_timeout_s = (decltype(p.confirm_timeout_s)) id(m_confirm_timeout_s).state;
          p.cooldown_s = (decltype(p.cooldown_s)) id(m_cooldown_s).state;
          p.top_right = std::string(id(macro_corner).current_option()) == "Top-right";
          p.dry_run = id(macro_dry_run).state;
          p.disable_jiggler = id(macro_disable_jiggler).state;
          p.quiet = id(macro_quiet).state;
          id(last_activity_ms) = millis();
          id(mouse)->macro_start((esphome::ble_hid_mouse::MacroMode) mode);

button:
  - platform: template
    name: "Jiggle now"
    icon: mdi:mouse
    on_press:
      - lambda: |-
          id(mouse)->jiggle_now();
  - platform: template
    name: "Start pairing mode"
    icon: mdi:bluetooth-connect
    on_press:
      - lambda: |-
          id(mouse)->start_pairing();
          id(last_activity_ms) = millis();
  - platform: template
    name: "Forget paired host"
    icon: mdi:bluetooth-off
    entity_category: config
    on_press:
      - lambda: |-
          id(mouse)->forget_host();
          id(last_activity_ms) = millis();
  - platform: template
    name: "Put Mac to sleep"
    id: macro_sleep_button
    icon: mdi:laptop-off
    on_press:
      - script.execute:
          id: macro_run
          mode: 0
  - platform: template
    name: "Cancel macro"
    icon: mdi:cancel
    on_press:
      - lambda: |-
          id(mouse)->macro_cancel();
  - platform: template
    name: "Macro test 1: go to corner"
    icon: mdi:numeric-1-box-outline
    entity_category: config
    on_press:
      - script.execute:
          id: macro_run
          mode: 1
  - platform: template
    name: "Macro test 2: go to Apple logo"
    icon: mdi:numeric-2-box-outline
    entity_category: config
    on_press:
      - script.execute:
          id: macro_run
          mode: 2
  - platform: template
    name: "Macro test 3: open Apple menu"
    icon: mdi:numeric-3-box-outline
    entity_category: config
    on_press:
      - script.execute:
          id: macro_run
          mode: 3
  - platform: template
    name: "Macro test 4: hover Sleep"
    icon: mdi:numeric-4-box-outline
    entity_category: config
    on_press:
      - script.execute:
          id: macro_run
          mode: 4
  # Keyboard spike (UNVERIFIED): the Mac must forget and re-pair this device once after this firmware.
  - platform: template
    name: "Key test: tap Space"
    icon: mdi:keyboard-space
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(mouse)->key_tap(0, esphome::ble_hid_mouse::HID_KEY_SPACE);
  - platform: template
    name: "Key test: type sample text"
    icon: mdi:keyboard-outline
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(mouse)->key_type("abc XYZ 123 !@#$%^&*() -_=+ [];',./", false);
  - platform: template
    name: "Key test: tap Eject"
    icon: mdi:eject
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(mouse)->consumer_tap(0x00B8);
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config

# -----------------------------------------------------------------------------
# Status
# -----------------------------------------------------------------------------
sensor:
  - platform: template
    name: "Next jiggle in"
    id: next_jiggle_sensor
    icon: mdi:timer-outline
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      int32_t s = id(mouse)->next_jiggle_in_s();
      if (s < 0) return NAN;
      return (float) s;
    filters:
      - delta: 0.5   # publish only when the value actually changed

  - platform: template
    name: "Last jiggle"
    id: last_jiggle_sensor
    device_class: timestamp
    icon: mdi:history

  - platform: template
    name: "Jiggles since boot"
    id: jiggle_count_sensor
    icon: mdi:counter
    state_class: total_increasing
    accuracy_decimals: 0
    lambda: |-
      return 0.0f;
    update_interval: never

  - platform: template
    name: "Time since BLE disconnect"
    id: since_disconnect_sensor
    icon: mdi:bluetooth-off
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(mouse)->seconds_since_disconnect();
    filters:
      - delta: 0.5

  - platform: template
    name: "Last sleep macro"
    id: macro_last_sensor
    device_class: timestamp
    icon: mdi:laptop-off
    update_interval: never

  - platform: wifi_signal
    name: "Wi-Fi signal"
    id: wifi_rssi
    update_interval: 30s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Free heap"
      entity_category: diagnostic
    block:
      name: "Largest free heap block"
      entity_category: diagnostic

# Heap diagnostics: watch these in HA to confirm there is no slow memory leak.
debug:
  update_interval: 60s

text_sensor:
  - platform: template
    name: "Sleep macro status"
    id: macro_status_sensor
    icon: mdi:laptop-off
    update_interval: never
  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
  - platform: version
    name: "ESPHome version"
    entity_category: diagnostic
    hide_timestamp: true
  - platform: template
    name: "Firmware build time"
    entity_category: diagnostic
    lambda: |-
      return std::string(__DATE__ " " __TIME__);
    update_interval: never

# -----------------------------------------------------------------------------
# Physical controls and LED
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "Sleep macro running"
    id: macro_running_sensor
    icon: mdi:progress-clock
    lambda: |-
      return id(mouse)->macro_running();
  # BOOT button. GPIO9 is a strapping pin: it is only read after boot.
  - platform: gpio
    id: boot_button
    pin:
      number: ${pin_button}
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    internal: true
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1500ms
        then:
          - lambda: 'id(mouse)->macro_ack();'
          - switch.toggle: display_on
      - min_length: 3s
        max_length: 9s
        then:
          - logger.log: "BOOT held 3s: pairing mode"
          - lambda: |-
              id(mouse)->start_pairing();
              id(last_activity_ms) = millis();
      - min_length: 10s
        max_length: 60s
        then:
          - logger.log: "BOOT held 10s: forget host + pairing mode"
          - lambda: |-
              id(mouse)->forget_host();
              id(last_activity_ms) = millis();

output:
  - platform: gpio
    id: led_out
    pin:
      number: ${pin_led}
      inverted: ${led_inverted}
      ignore_strapping_warning: true   # GPIO8 is a strapping pin; fine as a post-boot LED output

interval:
  # Optional heartbeat blip (off unless the HA switch is on). Non-blocking.
  - interval: 3s
    then:
      - if:
          condition:
            switch.is_on: led_heartbeat
          then:
            - output.turn_on: led_out
            - delay: 40ms
            - output.turn_off: led_out
  # Sleep macro: mirror status to HA and react to the end of a run. Cheap: publishes on change only.
  - interval: 250ms
    then:
      - lambda: |-
          auto *m = id(mouse);
          if (id(macro_status_sensor).state != m->macro_status()) id(macro_status_sensor).publish_state(m->macro_status());
          const uint32_t seq = m->macro_run_seq();
          if (seq != id(macro_seq_seen)) {
            id(macro_seq_seen) = seq;
            if (m->macro_last_was_live_full()) id(macro_last_sensor).publish_state((float) id(ha_time).timestamp_now());
            if (m->macro_last_slept() && id(macro_disable_jiggler).state) id(jiggler_enabled).turn_off();
          }
          if (id(quiet_persist) != m->quiet()) id(quiet_persist) = m->quiet();
          if (m->macro_running()) id(last_activity_ms) = millis();
  # Display power: blank when "Display on" is off, dim after the idle timeout.
  - interval: 250ms
    then:
      - lambda: |-
          const bool want_on = id(display_on).state;
          const float to = id(display_timeout).state;
          const bool idle = !std::isnan(to) && to > 0 &&
                            (millis() - id(last_activity_ms)) > (uint32_t) (to * 1000.0f);
          if (!want_on && !id(oled_off)) {
            id(oled)->turn_off();
            id(oled_off) = true;
          } else if (want_on && id(oled_off)) {
            id(oled)->turn_on();
            id(oled_off) = false;
            id(oled_dimmed) = false;
            id(oled)->set_contrast(1.0f);
          }
          if (want_on) {
            if (idle && !id(oled_dimmed)) {
              id(oled)->set_contrast(0.0f);
              id(oled_dimmed) = true;
            } else if (!idle && id(oled_dimmed)) {
              id(oled)->set_contrast(1.0f);
              id(oled_dimmed) = false;
            }
          }

# -----------------------------------------------------------------------------
# OLED
# -----------------------------------------------------------------------------
i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  frequency: 400kHz
  scan: true     # logs found device addresses at boot (bring-up step 1)

display:
  - platform: ssd1306_i2c
    id: oled
    model: ${oled_model}
    address: ${i2c_address}
    offset_x: ${oled_offset_x}
    offset_y: ${oled_offset_y}
    flip_x: ${oled_flip_x}
    flip_y: ${oled_flip_y}
    update_interval: 200ms   # 5 fps keeps I2C/CPU time low next to BLE + Wi-Fi
    lambda: |-
      if (!id(display_on).state) return;
      jiggler_ui::UiState s{};
      const bool ready = id(mouse)->is_ready();
      if (id(mouse)->pairing_active())  s.bt = jiggler_ui::BtState::PAIRING;
      else if (ready)                   s.bt = jiggler_ui::BtState::CONNECTED;
      else if (id(mouse)->has_bond())   s.bt = jiggler_ui::BtState::BONDED_IDLE;
      else                              s.bt = jiggler_ui::BtState::NO_BOND;
      s.enabled = id(jiggler_enabled).state;
      s.pulse = id(mouse)->ms_since_jiggle() < 1000;
      const bool wifi_up = wifi::global_wifi_component->is_connected();
      float rssi = id(wifi_rssi).state;
      if (!wifi_up) s.wifi_bars = 0;
      else if (std::isnan(rssi) || rssi > -55) s.wifi_bars = 4;
      else if (rssi > -65) s.wifi_bars = 3;
      else if (rssi > -75) s.wifi_bars = 2;
      else s.wifi_bars = 1;
      s.api_up = api::global_api_server->is_connected();
      s.progress = (s.enabled && ready) ? id(mouse)->interval_progress() : -1.0f;
      s.macro_stage = id(mouse)->macro_stage();
      s.macro_result = id(mouse)->macro_result_icon();
      s.dry_run = id(macro_dry_run).state;
      s.ota = id(ota_active);
      s.ota_pct = id(ota_percent);
      s.now_ms = millis();
      s.test_pattern = ${oled_test_pattern};
      // Any state change wakes the display from dimming.
      uint32_t sig = (ready ? 1 : 0) | (id(mouse)->has_bond() ? 2 : 0) | (id(mouse)->pairing_active() ? 4 : 0) |
                     (s.enabled ? 8 : 0) | (wifi_up ? 16 : 0) | (s.api_up ? 32 : 0) | (s.ota ? 64 : 0) |
                     (s.macro_stage ? 128 : 0) | (s.macro_result << 8) | (s.dry_run ? 1024 : 0);
      if (sig != id(last_sig)) {
        id(last_sig) = sig;
        id(last_activity_ms) = millis();
      }
      jiggler_ui::draw(it, s);
